<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>セリフ編集 - ぺいとり！</title>
<style>
  :root {
    --bg: #EEE8FF; --surface: #FFFFFF; --surface-2: #F7F4FF;
    --border: #DDD6F5; --border-2: #C4B8EE;
    --text: #180F3E; --text-2: #4E4280; --text-3: #9B90BC;
    --accent: #6C3EF8; --accent-h: #5530D4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 16px 96px;
    font-family: 'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.7;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  h1 small { font-size: 12px; color: var(--text-3); font-weight: 600; }
  .howto {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 14px 18px; margin: 14px 0; font-size: 13px; color: var(--text-2);
  }
  .howto b { color: var(--accent); }
  details {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
    margin: 10px 0; overflow: hidden;
  }
  details > summary {
    cursor: pointer; padding: 12px 16px; font-weight: 800; font-size: 14px;
    user-select: none; list-style: none; display: flex; align-items: center; gap: 8px;
  }
  details > summary::before { content: '▸'; color: var(--accent); transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  details > .body { padding: 0 16px 14px; }
  details details { border-radius: 10px; margin: 8px 0; }
  details details > summary { font-size: 13px; padding: 10px 14px; }
  .scene { margin: 10px 0; }
  .scene-label { font-size: 12px; font-weight: 800; color: var(--text-2); }
  .scene-desc { font-size: 11px; color: var(--text-3); margin-left: 6px; font-weight: 500; }
  textarea, input[type=text] {
    width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; font-family: inherit; color: var(--text);
    background: var(--surface); outline: none; line-height: 1.7;
  }
  textarea:focus, input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,62,248,.13); }
  textarea { resize: vertical; min-height: 38px; }
  .hint { font-size: 11px; color: var(--text-3); margin: 2px 0 0; }
  .field { margin: 8px 0; }
  .field > label { display: block; font-size: 12px; font-weight: 800; color: var(--text-2); margin-bottom: 3px; }
  .preview {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin: 14px 0;
  }
  .preview-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  select {
    border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 10px;
    font-size: 13px; font-family: inherit; background: var(--surface); color: var(--text);
  }
  .bubble-area { display: flex; align-items: flex-end; gap: 10px; min-height: 96px; }
  .bubble-area img { width: 92px; height: 92px; object-fit: contain; filter: drop-shadow(0 6px 12px rgba(52,38,99,.22)); }
  .bubble {
    background: var(--surface-2); border: 1.5px solid var(--border-2); border-radius: 14px 14px 14px 5px;
    padding: 10px 14px; font-size: 13px; font-weight: 700; margin-bottom: 14px; flex: 1;
  }
  button {
    border: none; border-radius: 99px; padding: 10px 18px; font-size: 13px; font-weight: 800;
    font-family: inherit; cursor: pointer; transition: transform .12s, box-shadow .15s;
  }
  button:active { transform: translateY(1px); }
  .btn-main { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(108,62,248,.35); }
  .btn-main:hover { background: var(--accent-h); }
  .btn-sub { background: var(--surface); color: var(--text-2); border: 1.5px solid var(--border-2); }
  .btn-sub:hover { border-color: var(--accent); color: var(--accent); }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
    border-top: 1.5px solid var(--border);
    padding: 12px max(16px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-bottom));
    display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
  }
  .bar .status { font-size: 12px; color: var(--text-2); font-weight: 700; min-width: 120px; text-align: center; }
  .err {
    background: #FEF2F2; border: 1.5px solid #FCA5A5; color: #DC2626;
    border-radius: 12px; padding: 12px 16px; font-weight: 700;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎭 セリフ編集 <small>ぺいとり！ / でいとり！ / わーとり</small></h1>
  <div class="howto">
    <b>使い方:</b> 下のフォームでセリフを書き換えたら、一番下の「<b>dialogue.js をダウンロード</b>」を押して、
    プロジェクトの <b>dialogue.js</b> を上書き保存 → push すれば反映されます。
    各欄は <b>1行 = 1セリフ</b>。行を増やせばセリフのバリエーションが増えます(表示時にランダムで選ばれます)。
    季節ネタを足したいときは、好きな場面に行を追加するだけでOK。
  </div>
  <div id="app"><p>dialogue.js を読み込み中…</p></div>
</div>
<div class="bar">
  <span class="status" id="status">編集待ち</span>
  <button class="btn-sub" id="btn-copy">📋 コピー</button>
  <button class="btn-main" id="btn-download">⬇ dialogue.js をダウンロード</button>
</div>
<script>
(function loadDialogue(){
  const s = document.createElement('script');
  s.src = 'dialogue.js?nocache=' + Date.now();
  s.onload = init;
  s.onerror = () => {
    document.getElementById('app').innerHTML =
      '<div class="err">dialogue.js が読み込めませんでした。このページはアプリと同じフォルダに置いて、サーバー経由(GitHub Pages や http-server)で開いてください。</div>';
  };
  document.head.appendChild(s);
})();

let CHARS = [];
const CHAR_IMG = {
  mentor: 'chibi_split_pngs/blue_white_girl_01_neutral.png',
  spark: 'chibi_split_pngs/red_antler_girl_01_neutral.png',
  butler: 'chibi_split_pngs/bat_wing_girl_01_neutral.png',
  yushka: 'chibi_split_pngs/yushka_01_neutral.png',
  adjutant: 'chibi_split_pngs/purple_adjutant_01_neutral.png'
};
const CHAR_IMG_DEFAULT = CHAR_IMG.mentor;
const DEFAULT_CHAR_ORDER = ['mentor', 'spark', 'butler', 'yushka', 'adjutant'];
const getCharImage = id => CHAR_IMG[id] || CHAR_IMG_DEFAULT;
function getDialogueCharacters(D) {
  const ids = new Set([
    ...DEFAULT_CHAR_ORDER,
    ...Object.keys(D.characters || {}),
    ...Object.keys(D.patient || {}),
    ...Object.keys(D.daily || {}),
    ...Object.keys(D.work || {}),
    ...Object.keys((D.estimate || {}).patient || {}),
    ...Object.keys((D.estimate || {}).daily || {})
  ]);
  return [...ids].filter(id => {
    if (!id) return false;
    return D.characters?.[id] || D.patient?.[id] || D.daily?.[id] || D.work?.[id] || D.estimate?.patient?.[id] || D.estimate?.daily?.[id];
  });
}
const MODES = { patient: 'ぺいとり（患者モード）', daily: 'でいとり（生活モード）', work: 'わーとり（大仕事モード）' };
const SCENES = {
  start:    ['起動・モード切替', 'アプリを開いたとき / モードを切り替えたとき'],
  suggest:  ['次の一手の提案', '「次の一手」を提案したとき'],
  add:      ['タスク追加', 'タスクや受け持ちを追加したとき'],
  done:     ['完了', 'タスクを完了したとき'],
  tally:    ['カウント+1', '件数カウンターが進んだとき'],
  allclear: ['全部完了', 'タスクが全部なくなったとき'],
  endday:   ['今日はおしまい', '「今日はおしまい！」したとき'],
  stuck:    ['詰まった', '「詰まった」を押したとき'],
  idle:     ['放置中', 'しばらく操作がないとき（1分ごとに抽選）'],
  daydream: ['ぼんやり', 'idleの代わりにたまに出る']
};
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function init(){
  const D = window.APP_DIALOGUE;
  if (!D) { document.getElementById('app').innerHTML = '<div class="err">window.APP_DIALOGUE が見つかりません。dialogue.js の形式を確認してください。</div>'; return; }
  CHARS = getDialogueCharacters(D);
  let html = '';

  // プレビュー
  html += '<div class="preview"><div class="preview-row">'
    + '<select id="pv-mode">' + Object.entries(MODES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('') + '</select>'
    + '<select id="pv-char">' + CHARS.map(c => `<option value="${c}">${esc((D.characters?.[c] || {}).name || c)}</option>`).join('') + '</select>'
    + '<select id="pv-scene">' + Object.entries(SCENES).map(([k, [label]]) => `<option value="${k}">${label}</option>`).join('') + '</select>'
    + '<button class="btn-sub" id="pv-btn">🎲 試しに表示</button>'
    + '</div><div class="bubble-area"><img id="pv-img" src="' + getCharImage(CHARS[0]) + '" alt=""><div class="bubble" id="pv-bubble">ここにセリフが出ます（編集中の内容から抽選）</div></div></div>';

  // キャラ設定
  html += '<details><summary>キャラクター設定（人物像・口調ルール ※AI一言生成にも使われる）</summary><div class="body">';
  for (const c of CHARS) {
    const ch = D.characters?.[c] || {};
    html += `<details><summary>${esc(ch.name || c)} <span class="scene-desc">(${c})</span></summary><div class="body">`
      + `<div class="field"><label>名前</label><input type="text" id="ch-${c}-name" value="${esc(ch.name || '')}"></div>`
      + `<div class="field"><label>人物像</label><textarea id="ch-${c}-persona" rows="2">${esc(ch.persona || '')}</textarea></div>`
      + `<div class="field"><label>口調ルール（1行 = 1ルール）</label><textarea id="ch-${c}-rules" rows="4">${esc((ch.rules || []).join('\n'))}</textarea></div>`
      + `<div class="field"><label>避ける表現（1行 = 1項目）</label><textarea id="ch-${c}-avoid" rows="3">${esc((ch.avoid || []).join('\n'))}</textarea></div>`
      + '</div></details>';
  }
  html += '</div></details>';

  // モードごとのセリフ
  for (const [mode, modeLabel] of Object.entries(MODES)) {
    html += `<details><summary>${modeLabel} のセリフ</summary><div class="body">`;
    for (const c of CHARS) {
      const name = (D.characters?.[c] || {}).name || c;
      html += `<details><summary>${esc(name)}</summary><div class="body">`;
      for (const [scene, [label, desc]] of Object.entries(SCENES)) {
        const lines = ((D[mode] || {})[c] || {})[scene] || [];
        html += `<div class="scene"><span class="scene-label">${label}</span><span class="scene-desc">${desc}</span>`
          + `<textarea id="ta-${mode}-${c}-${scene}" rows="${Math.max(2, lines.length)}">${esc(lines.join('\n'))}</textarea></div>`;
      }
      html += '</div></details>';
    }
    html += '</div></details>';
  }

  // 見積もり
  html += '<details><summary>見積もり読み上げ（残りタスクの所要時間アナウンス）</summary><div class="body">'
    + '<p class="hint">使える変数: {count}=残り件数 {duration}=合計時間 {finishTime}=終了予想時刻 / でいとりは {freeDuration}=0:00までの自由時間。some=残タスクあり / none=ゼロのとき。</p>';
  for (const group of ['patient', 'daily']) {
    html += `<details><summary>${group === 'patient' ? 'ぺいとり' : 'でいとり'}</summary><div class="body">`;
    for (const c of CHARS) {
      const set = ((D.estimate || {})[group] || {})[c] || {};
      const name = (D.characters?.[c] || {}).name || c;
      html += `<div class="field"><label>${esc(name)} / 残タスクあり (some)</label><textarea id="est-${group}-${c}-some" rows="2">${esc(set.some || '')}</textarea></div>`
        + `<div class="field"><label>${esc(name)} / 残タスクゼロ (none)</label><textarea id="est-${group}-${c}-none" rows="2">${esc(set.none || '')}</textarea></div>`;
    }
    html += '</div></details>';
  }
  html += '</div></details>';

  // ご褒美 & マイルストーン
  const rw = D.reward || {};
  html += '<details><summary>ご褒美ポップアップ（キャラをつついたとき）</summary><div class="body">'
    + '<p class="hint">使える変数: {text}=ご褒美の内容 {when}=いつ</p>'
    + `<div class="field"><label>いつ指定あり</label><input type="text" id="rw-withWhen" value="${esc(rw.withWhen || '')}"></div>`
    + `<div class="field"><label>いつ指定なし</label><input type="text" id="rw-noWhen" value="${esc(rw.noWhen || '')}"></div>`
    + `<div class="field"><label>ご褒美が未登録のとき</label><input type="text" id="rw-empty" value="${esc(rw.empty || '')}"></div>`
    + '</div></details>';

  html += '<details><summary>マイルストーン（1日n件完了のお祝い）</summary><div class="body">';
  for (const n of [5, 10, 15, 20, 25, 30]) {
    html += `<div class="field"><label>${n}件達成</label><input type="text" id="ms-${n}" value="${esc((D.milestones || {})[n] || '')}"></div>`;
  }
  html += '</div></details>';

  document.getElementById('app').innerHTML = html;
  document.getElementById('app').addEventListener('input', () => setStatus('未保存の編集あり'));
  document.getElementById('pv-btn').addEventListener('click', previewLine);
  document.getElementById('pv-char').addEventListener('change', () => {
    document.getElementById('pv-img').src = getCharImage(document.getElementById('pv-char').value);
  });
  document.getElementById('btn-copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(buildFile()); setStatus('コピーしました ✓'); }
    catch { setStatus('コピー失敗…ダウンロードを使ってください'); }
  });
  document.getElementById('btn-download').addEventListener('click', () => {
    const blob = new Blob([buildFile()], { type: 'text/javascript' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'dialogue.js' });
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
    setStatus('ダウンロードしました ✓');
  });
}

function setStatus(text){ document.getElementById('status').textContent = text; }
const taLines = id => (document.getElementById(id)?.value || '').split('\n').map(s => s.trim()).filter(Boolean);
const val = id => (document.getElementById(id)?.value || '').trim();

function collect(){
  const out = { characters: {}, patient: {}, daily: {}, work: {}, estimate: { patient: {}, daily: {} }, reward: {}, milestones: {} };
  for (const c of CHARS) {
    out.characters[c] = { name: val(`ch-${c}-name`), persona: val(`ch-${c}-persona`), rules: taLines(`ch-${c}-rules`), avoid: taLines(`ch-${c}-avoid`) };
    for (const mode of Object.keys(MODES)) {
      out[mode][c] = {};
      for (const scene of Object.keys(SCENES)) out[mode][c][scene] = taLines(`ta-${mode}-${c}-${scene}`);
    }
    for (const group of ['patient', 'daily']) {
      out.estimate[group][c] = { some: val(`est-${group}-${c}-some`), none: val(`est-${group}-${c}-none`) };
    }
  }
  out.reward = { withWhen: val('rw-withWhen'), noWhen: val('rw-noWhen'), empty: val('rw-empty') };
  for (const n of [5, 10, 15, 20, 25, 30]) out.milestones[n] = val(`ms-${n}`);
  return out;
}

function previewLine(){
  const mode = document.getElementById('pv-mode').value;
  const c = document.getElementById('pv-char').value;
  const scene = document.getElementById('pv-scene').value;
  const lines = taLines(`ta-${mode}-${c}-${scene}`);
  document.getElementById('pv-bubble').textContent = lines.length
    ? lines[Math.floor(Math.random() * lines.length)]
    : '（この場面のセリフが空です。空のままだと放置中のセリフが代わりに出ます）';
}

function buildFile(){
  const d = collect();
  const j = obj => JSON.stringify(obj, null, 2).replace(/\n/g, '\n  ');
  return [
    '// ============================================================',
    '// ぺいとり！ セリフ定義ファイル (dialogue.js)',
    '// ============================================================',
    '// このファイルを書き換えて保存すれば、アプリのセリフが変わります。',
    '// ブラウザで dialogue-editor.html を開くと、フォームで編集して',
    '// このファイルを丸ごと生成し直すこともできます。',
    '//',
    '// ▼ 場面(シーン)の意味',
    '//   start=起動・モード切替 / suggest=次の一手提案 / add=タスク追加',
    '//   done=完了 / tally=カウント+1 / allclear=全部完了 / endday=今日はおしまい',
    '//   stuck=詰まった / idle=放置中(1分ごと抽選) / daydream=たまに出るぼんやり',
    '//',
    '// ▼ estimate のプレースホルダー',
    '//   {count}=残り件数 {duration}=合計時間 {finishTime}=終了予想時刻',
    '//   {freeDuration}=0:00までの自由時間(でいとりのみ)',
    '//   some=残タスクあり / none=残タスクゼロ',
    '// ============================================================',
    '',
    'window.APP_DIALOGUE = {',
    '',
    '  // ── キャラクター設定(口調の人物像。AI一言生成のプロンプトにも使われる) ──',
    '  characters: ' + j(d.characters) + ',',
    '',
    '  // ── ぺいとり(患者モード) ──',
    '  patient: ' + j(d.patient) + ',',
    '',
    '  // ── でいとり(生活モード) ──',
    '  daily: ' + j(d.daily) + ',',
    '',
    '  // ── わーとり(大仕事モード) ──',
    '  work: ' + j(d.work) + ',',
    '',
    '  // ── 見積もり読み上げ ──',
    '  estimate: ' + j(d.estimate) + ',',
    '',
    '  // ── ご褒美ポップアップ ──',
    '  reward: ' + j(d.reward) + ',',
    '',
    '  // ── 1日n件完了のお祝いトースト ──',
    '  milestones: ' + j(d.milestones),
    '};',
    ''
  ].join('\n');
}
</script>
</body>
</html>
