/* Chibi coach popups */
    .chibi-coach {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 9000;
      display: grid;
      grid-template-columns: 124px minmax(170px, 270px);
      align-items: end;
      gap: 10px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(18px) scale(.96);
      transition: opacity .22s ease, transform .22s cubic-bezier(.2,.9,.2,1);
    }
    .chibi-coach.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      cursor: pointer;
    }
    .chibi-coach img {
      width: 124px;
      height: 124px;
      object-fit: contain;
      transform-origin: center bottom;
      filter: drop-shadow(0 8px 16px rgba(52, 38, 99, .22));
      animation: chibiFloat 1.9s ease-in-out infinite;
    }
    .chibi-coach[data-actor="mentor"],
    .chibi-coach[data-actor="spark"],
    .chibi-coach[data-actor="butler"],
    .chibi-coach[data-actor="yushka"] { --chibi-scale: 1; }
    .chibi-coach-bubble {
      position: relative;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 14px 14px 14px 5px;
      background: rgba(255, 255, 255, .94);
      border: 1.5px solid rgba(120, 96, 180, .18);
      box-shadow: 0 10px 28px rgba(60, 42, 120, .18);
      color: var(--text, #31264A);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.55;
      letter-spacing: 0;
      backdrop-filter: blur(10px);
    }
    .chibi-coach-bubble::before {
      content: "";
      position: absolute;
      left: -8px;
      bottom: 14px;
      width: 14px;
      height: 14px;
      background: inherit;
      border-left: 1.5px solid rgba(120, 96, 180, .18);
      border-bottom: 1.5px solid rgba(120, 96, 180, .18);
      transform: rotate(45deg);
    }
    @keyframes chibiFloat {
      0%, 100% { transform: translateY(0) scale(var(--chibi-scale, 1)); }
      50% { transform: translateY(-4px) scale(var(--chibi-scale, 1)); }
    }
    @media (max-width: 560px) {
      .chibi-coach {
        right: 10px;
        bottom: 10px;
        grid-template-columns: 96px minmax(0, 1fr);
        max-width: calc(100vw - 20px);
      }
      .chibi-coach img {
        width: 96px;
        height: 96px;
      }
      .chibi-coach-bubble {
        max-width: calc(100vw - 138px);
        padding: 9px 10px;
        font-size: 11px;
      }
    }
    .pwa-install-button {
      position: fixed;
      left: max(12px, env(safe-area-inset-left));
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 9100;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1.5px solid rgba(255,255,255,.82);
      border-radius: 999px;
      padding: 9px 14px;
      background: #1d4ed8;
      color: #fff;
      box-shadow: 0 8px 22px rgba(29,78,216,.28);
      font: 800 12px/1.2 system-ui, sans-serif;
      letter-spacing: 0;
    }
    .pwa-install-button.show { display: inline-flex; }

<style>
:root {
  --bg:        #EEE8FF;
  --surface:   #FFFFFF;
  --surface-2: #F7F4FF;
  --surface-3: #EDE6FF;
  --border:    #DDD6F5;
  --border-2:  #C4B8EE;
  --text:      #180F3E;
  --text-2:    #4E4280;
  --text-3:    #9B90BC;
  --accent:    #6C3EF8;
  --accent-h:  #5530D4;
  --done:      #16A34A;
  --stuck-fg:  #DC2626;
  --high:      #EF4444;
  --shadow-xs: 0 1px 3px rgba(108,62,248,.10);
  --shadow-sm: 0 2px 10px rgba(108,62,248,.10), 0 1px 3px rgba(108,62,248,.06);
  --shadow:    0 4px 20px rgba(108,62,248,.14), 0 2px 6px rgba(108,62,248,.08);
  --shadow-lg: 0 8px 36px rgba(108,62,248,.20), 0 3px 10px rgba(108,62,248,.10);
  --r:   14px;
  --r-s: 10px;
  --r-xs: 7px;
  --font-sans: 'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
  --font-serif:'Noto Serif JP','Yu Mincho',serif;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-sans);
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(108,62,248,.07) 1px, transparent 0);
  background-size: 24px 24px;
  min-height: 100vh;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

body.work-mode:not(.rpg-mode) {
  --bg:        #EAF0FF;
  --surface:   #FFFFFF;
  --surface-2: #F3F6FF;
  --surface-3: #DFE9FF;
  --border:    #CBD7F2;
  --border-2:  #AFC0E4;
  --text:      #111827;
  --text-2:    #334155;
  --text-3:    #71809D;
  --accent:    #2F6FED;
  --accent-h:  #1E4FBF;
  --shadow-xs: 0 1px 3px rgba(30,79,191,.10);
  --shadow-sm: 0 2px 10px rgba(30,79,191,.10), 0 1px 3px rgba(15,23,42,.05);
  --shadow:    0 4px 20px rgba(30,79,191,.13), 0 2px 6px rgba(15,23,42,.06);
  --shadow-lg: 0 8px 36px rgba(30,79,191,.18), 0 3px 10px rgba(15,23,42,.08);
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(47,111,237,.075) 1px, transparent 0);
}

/* ── アニメーション ── */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes toastIn {
  from { opacity:0; transform:translateX(-50%) translateY(16px) scale(.94); }
  to   { opacity:1; transform:translateX(-50%) translateY(0)    scale(1); }
}
@keyframes pulse-glow {
  0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
  60%     { box-shadow: 0 0 0 6px rgba(239,68,68,.0); }
}
@keyframes checkPop {
  0%   { transform:scale(0) rotate(-20deg); }
  55%  { transform:scale(1.3) rotate(5deg); }
  100% { transform:scale(1) rotate(0deg); }
}
@keyframes slideDown {
  from { opacity:0; transform:translateY(-8px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes shimmer {
  from { background-position: -200% center; }
  to   { background-position: 200% center; }
}
@keyframes crackerRayPop {
  0%   { opacity:0; transform:translate(-50%, -50%) rotate(var(--angle)) translateX(18px) scaleX(.15); }
  18%  { opacity:1; }
  100% { opacity:0; transform:translate(-50%, -50%) rotate(var(--angle)) translateX(var(--distance)) scaleX(1); }
}
@keyframes confettiPop {
  0%   { opacity:0; transform:translate(-50%, -50%) rotate(0deg) scale(.55); }
  12%  { opacity:1; }
  100% { opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--spin)) scale(1); }
}
.celebrate-confetti,
.celebrate-rays {
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}
.cracker-ray {
  position:absolute;
  left:50%;
  top:50%;
  width:clamp(82px, 18vw, 170px);
  height:4px;
  border-radius:999px;
  background:linear-gradient(90deg, transparent, var(--color), transparent);
  transform-origin:left center;
  animation:crackerRayPop .78s cubic-bezier(.18,.92,.22,1) both;
  animation-delay:var(--delay);
}
.confetti-piece {
  position:absolute;
  left:50%;
  top:50%;
  width:10px;
  height:16px;
  border-radius:3px;
  background:var(--color);
  box-shadow:0 2px 6px rgba(24,15,62,.16);
  animation:confettiPop 1.35s cubic-bezier(.12,.82,.22,1) both;
  animation-delay:var(--delay);
}
.confetti-piece.round {
  width:11px;
  height:11px;
  border-radius:50%;
}
.confetti-piece.ribbon {
  width:18px;
  height:7px;
  border-radius:999px;
}

/* ── カード ── */
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s ease, transform .2s ease;
  animation: fadeUp .24s cubic-bezier(.34,1.26,.64,1) both;
}
.card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }

/* ── ボタン ── */
.btn-dark {
  display:inline-flex; align-items:center; gap:7px;
  background: var(--accent);
  color: #fff;
  border:none; border-radius: 99px;
  padding: 10px 20px; font-size:13px; font-weight:700;
  font-family: var(--font-sans);
  letter-spacing:.03em; cursor:pointer;
  box-shadow: 0 4px 14px rgba(108,62,248,.35);
  transition: background .15s, box-shadow .15s, transform .12s;
}
.btn-dark:hover  { background: var(--accent-h); box-shadow:0 6px 18px rgba(108,62,248,.45); transform:translateY(-2px); }
.btn-dark:active { transform:translateY(0); box-shadow:0 2px 8px rgba(108,62,248,.25); }

.btn-ghost {
  display:inline-flex; align-items:center; gap:6px;
  background: var(--surface);
  border: 1.5px solid var(--border-2);
  border-radius: 99px;
  padding: 9px 16px; font-size:13px;
  color: var(--text-2); cursor:pointer;
  font-family: var(--font-sans); font-weight:600;
  transition: background .15s, border-color .15s, transform .12s, color .15s;
  box-shadow: var(--shadow-xs);
}
.btn-ghost:hover  { background:var(--surface-3); border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
.btn-ghost:active { transform:translateY(0); }

.btn-ghost-active {
  background: var(--surface-3) !important;
  border-color: var(--accent) !important;
  color: var(--accent) !important;
}

.btn-green {
  display:inline-flex; align-items:center; gap:6px;
  background:#16A34A; color:#fff;
  border:none; border-radius: 99px;
  padding:9px 18px; font-size:13px; font-weight:700;
  font-family:var(--font-sans); cursor:pointer;
  box-shadow:0 4px 12px rgba(22,163,74,.30);
  transition: background .15s, box-shadow .15s, transform .12s;
}
.btn-green:hover  { background:#15803D; box-shadow:0 6px 16px rgba(22,163,74,.40); transform:translateY(-2px); }
.btn-green:active { transform:translateY(0); }

.btn-rose {
  display:inline-flex; align-items:center; gap:6px;
  background:transparent;
  border:1.5px solid #FCA5A5; border-radius:99px;
  padding:8px 16px; font-size:13px; font-weight:600;
  color:#DC2626; cursor:pointer; font-family:var(--font-sans);
  transition: background .15s, transform .12s;
}
.btn-rose:hover  { background:#FEF2F2; transform:translateY(-1px); }
.btn-rose:active { transform:translateY(0); }

.btn-sm {
  display:inline-flex; align-items:center; gap:4px;
  background:transparent; border:none;
  font-size:11px; color:var(--text-3); cursor:pointer;
  font-family:var(--font-sans);
  padding:3px 7px; border-radius:6px;
  font-weight:500;
  transition:color .12s, background .12s;
}
.btn-sm:hover { color:var(--text-2); background:var(--surface-3); }
/* ── コマンドドック ── */
.command-dock {
  display:flex; align-items:center; flex-wrap:wrap; gap:6px;
  margin-bottom:14px; padding:6px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(221,214,254,.9);
  border-radius:15px;
  box-shadow:0 8px 22px rgba(76,54,139,.07);
  backdrop-filter:blur(10px);
}
.action-cluster {
  display:flex; align-items:center; gap:4px;
  min-height:38px; padding:4px;
  background:rgba(248,246,255,.76);
  border:1px solid rgba(231,226,247,.86);
  border-radius:12px;
}
.action-cluster-primary { flex:1 1 210px; }
.action-cluster-tools { margin-left:auto; }
.command-dock .btn-dark,
.command-dock .btn-ghost,
.command-dock .btn-rose {
  min-height:30px; padding:6px 10px; font-size:12px;
  box-shadow:none;
  white-space:nowrap; flex-shrink:0;
}
.command-dock .btn-dark { padding-inline:13px; }
.command-dock .btn-ghost { border-width:1px; }
.command-dock .btn-ghost-active {
  background:var(--accent) !important;
  border-color:var(--accent) !important;
  color:#fff !important;
  box-shadow:0 5px 14px rgba(108,62,248,.22) !important;
}
.command-dock .dock-icon { min-width:34px; justify-content:center; padding-inline:9px; font-weight:900; }
.command-dock .dock-alert { margin-left:auto; }
@media (max-width:560px) {
  .command-dock { padding:6px; gap:6px; }
  .action-cluster { max-width:100%; overflow-x:auto; scrollbar-width:none; }
  .action-cluster::-webkit-scrollbar { display:none; }
  .action-cluster-tools { margin-left:0; }
}

/* ── インプット ── */
.inp {
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--r-s);
  padding:10px 14px; font-size:13px;
  color:var(--text); width:100%;
  font-family:var(--font-sans);
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.inp:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,62,248,.15); }
.inp::placeholder { color:var(--text-3); }
@media (max-width:560px) {
  .scheduled-event-section {
    padding: 12px !important;
  }
  .scheduled-event-form {
    grid-template-columns: minmax(0, 104px) 72px minmax(0, 1fr) auto !important;
    gap: 6px !important;
  }
  .scheduled-event-form .scheduled-date-input,
  .scheduled-event-form .scheduled-time-input {
    min-width: 0;
    padding: 8px 6px;
    font-size: 11px;
  }
  .scheduled-event-form .scheduled-title-input {
    grid-column: 1 / -1;
    min-width: 0;
  }
  .scheduled-event-form .btn-dark {
    width: 38px;
    min-width: 38px;
    padding: 8px 0;
    justify-content: center;
    font-size: 0;
    gap: 0;
  }
  .scheduled-event-form .btn-dark svg {
    display: block;
    width: 16px;
    height: 16px;
  }
}

/* ── 回診スタンプ ── */
@media (max-width:560px) {
  .round-stamp-time { display:none; }
  .round-dock-label { display:none; }
}

/* ── チェックボックス ── */
.check-circle {
  width:22px; height:22px; border-radius:50%;
  border:2.5px solid var(--border-2);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; cursor:pointer;
  transition:border-color .15s, background .15s, transform .12s;
  background:transparent;
}
.check-circle:hover { border-color:var(--accent); transform:scale(1.1); }
.check-circle.done  {
  background:var(--done); border-color:var(--done);
  animation:checkPop .28s cubic-bezier(.34,1.56,.64,1) both;
}
.check-circle.stuck { border-color:var(--stuck-fg); }

/* ── タグ/バッジ ── */
.tag {
  display:inline-flex; align-items:center;
  font-size:11px; padding:3px 9px; border-radius:99px;
  font-weight:600; line-height:1.6; white-space:nowrap;
  letter-spacing:.02em;
}
.time-tag {
  display:inline-flex; align-items:center; gap:4px;
  font-size:11px; padding:3px 9px; border-radius:99px;
  font-weight:700; font-family:monospace; white-space:nowrap;
}
.time-tag.past { animation:pulse-glow 1.8s ease infinite; }

/* ── 優先度バー ── */
.pri-er     { border-left:5px solid #FF1493; background:linear-gradient(90deg, rgba(255,20,147,.10), var(--surface) 34%); }
.pri-high   { border-left:4px solid #EF4444; }
.pri-normal { border-left:4px solid #D4930A; }
.pri-low    { border-left:4px solid #22C55E; }
.pri-planned { border-left:4px solid #CBD5E1; }

/* ── セクション区切り ── */
.task-list > li { border-bottom:1px solid #F0ECFF; }
.task-list > li:last-child { border-bottom:none; }

/* ── 提案カード ── */
.suggestion-card {
  border-radius:var(--r);
  box-shadow:var(--shadow);
  animation:slideDown .22s cubic-bezier(.34,1.26,.64,1) both;
}

/* ── トースト ── */
.toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
  background:var(--text); color:#fff;
  padding:11px 24px; border-radius:99px; font-size:13px; font-weight:600;
  letter-spacing:.02em; white-space:nowrap;
  box-shadow:0 6px 28px rgba(24,15,62,.35);
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1) both;
  z-index:100;
}
@media (max-width:560px) {
  .toast {
    bottom: 126px;
    max-width: calc(100vw - 28px);
    white-space: normal;
    text-align: center;
  }
}

/* ── ダイアログ ── */
.dialog-bg {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  padding:16px; z-index:50;
  background:rgba(24,15,62,.55);
  backdrop-filter:blur(6px);
}
.dialog {
  background:var(--surface); border-radius:20px;
  box-shadow:var(--shadow-lg);
  padding:28px; width:100%; max-width:480px;
  animation:fadeUp .22s cubic-bezier(.34,1.26,.64,1) both;
  border:1.5px solid var(--border);
}

/* ── GASステータスバッジ ── */
.gas-badge {
  display:inline-flex; align-items:center; gap:4px;
  font-size:11px; font-weight:700;
  padding:4px 12px; border-radius:99px;
}

/* ── スクロールバー ── */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:2px; }

/* ── フォーカスモード特別スタイル ── */
.focus-card {
  background:var(--surface);
  border-radius:var(--r);
  box-shadow:var(--shadow-lg);
  padding:32px; border:1.5px solid var(--border);
  animation:fadeUp .25s cubic-bezier(.34,1.26,.64,1) both;
}

input[type="time"]::-webkit-calendar-picker-indicator { opacity:.5; }

/* ── セットチップ ── */
.set-chip {
  display:inline-flex; align-items:center; gap:4px;
  font-size:11px; padding:4px 12px; border-radius:99px;
  background:var(--surface-2); color:var(--accent);
  border:1.5px solid var(--border-2); cursor:pointer;
  font-family:var(--font-sans); font-weight:600;
  transition:background .15s, border-color .15s, transform .12s, box-shadow .12s;
}
.set-chip:hover { background:var(--surface-3); border-color:var(--accent); transform:translateY(-1px); box-shadow:0 3px 10px rgba(108,62,248,.15); }
.set-chip:active { transform:translateY(0); }

/* ── ヘッダー ── */
.app-header {
  background: linear-gradient(135deg, #180F3E 0%, #3D2080 60%, #5E3AC4 100%);
  border-radius: 20px;
  padding: 24px 28px;
  margin-bottom: 20px;
  box-shadow: 0 8px 32px rgba(24,15,62,.30);
  color: #fff;
  position: relative;
  overflow: hidden;
}

.app-header::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(90deg, rgba(24,15,62,.96) 0%, rgba(45,27,104,.84) 36%, rgba(45,27,104,.42) 64%, rgba(24,15,62,.18) 100%),
    url('patient_triage_vendor/header-nurse-station.png');
  background-size: cover;
  background-position: center right;
  opacity: .82;
  pointer-events: none;
  z-index: 0;
}

.app-header::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    url('chibi_split_pngs/yushka_09_smug.png'),
    url('chibi_split_pngs/red_antler_girl_03_cheer.png'),
    url('chibi_split_pngs/bat_wing_girl_01_neutral.png'),
    url('chibi_split_pngs/blue_white_girl_06_clipboard.png');
  background-repeat: no-repeat;
  background-size: auto 124px, auto 124px, auto 124px, auto 124px;
  background-position:
    right 18px bottom -8px,

    const next = headerCastClasses[headerCastIndex];
    if (next) document.body.classList.add(next);
  }
  function pickCastEntry(entries){
    if (!entries || !entries.length) return ['mentor', 'neutral'];
    const pool = entries.length > 1 ? entries.filter(([who]) => who !== lastActor) : entries;
    const entry = pick(pool.length ? pool : entries);
    lastActor = entry[0];
    return entry;
  }

  window.__triagePickAiCoachCharacter = function(kind, mode){
    const normalizedMode = mode === 'work' ? 'work' : mode === 'daily' ? 'daily' : 'patient';
    const flowKey = kind === 'endday' ? 'endday' : 'start';
    const [who, pose] = pickCastEntry(flows[flowKey] || flows.start);
    return {
      actor: who,
      pose,
      mode: normalizedMode,
      ...voiceProfileFor(who, normalizedMode, flowKey)
    };
  };

  function ensureCoach(){
    if (el) return;
    el = document.createElement('div');
    el.className = 'chibi-coach';
    el.setAttribute('aria-live', 'polite');
    el.setAttribute('role', 'button');
    el.setAttribute('title', 'つつくとご褒美をくれる');
    el.innerHTML = '<img decoding="async" loading="eager" alt=""><div class="chibi-coach-bubble"><span class="chibi-coach-text"></span></div>';
    document.body.appendChild(el);
    img = el.querySelector('img');
    textEl = el.querySelector('.chibi-coach-text');
    el.addEventListener('click', () => {
      window.dispatchEvent(new CustomEvent('chibi-coach', { detail: { kind: 'reward' } }));
    });
  }

  function show(kind, force, customText, meta, forcedActor, forcedPose){
    const now = Date.now();
    if (!force && now - lastShown < 1800) return;
    lastShown = now;
    ensureCoach();
    let effectiveKind = kind;
    let rewardOverride = null;
    if (kind === 'reward') {
      const r = pickReward();
      if (r) {
        rewardOverride = formatRewardLine(r);
      } else {
        rewardOverride = (D.reward && D.reward.empty) || '🎁 ご褒美はまだ設定されていません。';
      }
    } else if (!customText && (kind === 'done' || kind === 'endday') && Math.random() < 0.05) {
      const r = pickReward();
      if (r) rewardOverride = formatRewardLine(r);
    }
    if (!customText && !rewardOverride && kind === 'idle' && Math.random() < 0.08) {
      effectiveKind = 'daydream';
    }
    const flowKey = (kind === 'reward') ? 'reward' : effectiveKind;
    const flowList = (flowKey === 'reward') ? rewardFlow : (flows[flowKey] || flows.idle);
    let who, pose;
    if (forcedActor && cast[forcedActor]) {
      who = forcedActor;
      pose = forcedPose || (flowList.find(([entryWho]) => entryWho === who) || [who, 'neutral'])[1];
      lastActor = who;
    } else {
      [who, pose] = pickCastEntry(flowList);
    }
    const actor = cast[who];
    el.dataset.actor = who;
    img.src = CHIBI_BASE + (actor.img[pose] || actor.img.neutral);
    img.alt = actor.alt;
    const lines = linesFor(who, currentMode);
    textEl.textContent = customText || rewardOverride || (effectiveKind === 'estimate' ? (estimateFor(who, currentMode, meta) || pick(lines.idle || FALLBACK_LINES)) : pick(lines[effectiveKind] || lines.idle || FALLBACK_LINES));
    clearTimeout(hideTimer);
    el.classList.add('show');
    hideTimer = setTimeout(() => el.classList.remove('show'), kind === 'allclear' ? 5200 : (kind === 'start' || kind === 'reward') ? 4200 : 3300);
  }

  function classifyButton(button){
    if (button.getAttribute('aria-label') === '1件追加') return null;
    const text = (button.textContent || '').replace(/\s+/g, '');
    const klass = button.className || '';
    if (klass.includes('btn-green')) return 'done';
    if (klass.includes('btn-rose')) return 'stuck';
    if (text.includes('保留')) return 'idle';
    if (text.includes('詰') || text.includes('困') || text.includes('stuck')) return 'stuck';
    if (text.includes('次') || text.includes('候補') || text.includes('決め')) return 'suggest';
    if (text.includes('追加') || text.includes('Add') || text.includes('+')) return 'add';
    if (text.includes('終了') || text.includes('退院') || text.includes('完了') || text.includes('済') || text.includes('Done')) return 'done';
    return null;
  }

  window.addEventListener('chibi-coach', event => {
    const detail = event.detail || {};
    show(detail.kind || 'idle', true, detail.text || '', detail.estimate || null, detail.actor || '', detail.pose || '');
  });
  window.addEventListener('triage-mode-change', event => {
    const nextMode = event.detail?.mode;
    currentMode = nextMode === 'work' ? 'work' : nextMode === 'daily' ? 'daily' : 'patient';
    rotateHeaderCast(true);
    show('start', true);
  });
  window.addEventListener('triage-running-change', event => {
    runningToolActive = !!event.detail?.active;
  });

  window.addEventListener('load', () => {
    rotateHeaderCast(true);
    setTimeout(() => show('start', true), 1300);
    setInterval(() => {
      if (document.hidden || runningToolActive) return;
      show('idle', false);
      rotateHeaderCast(false);
    }, 60000);
  });

  document.addEventListener('click', event => {
    const button = event.target.closest && event.target.closest('button');
    if (!button) return;
    const kind = classifyButton(button);
    if (kind) setTimeout(() => show(kind, false), 160);
  }, true);
})();
</script>

<script>
(() => {
  let installPrompt = null;
  const isStandalone = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  window.addEventListener('beforeinstallprompt', event => {
    if (isStandalone()) return;
    event.preventDefault();
    installPrompt = event;
    let button = document.querySelector('.pwa-install-button');
    if (!button) {
      button = document.createElement('button');
      button.type = 'button';
      button.className = 'pwa-install-button';
      button.textContent = 'アプリをインストール';
      document.body.appendChild(button);
      button.addEventListener('click', async () => {
        if (!installPrompt) return;
        button.classList.remove('show');
        installPrompt.prompt();
        await installPrompt.userChoice.catch(() => null);
        installPrompt = null;
      });
    }
    button.classList.add('show');
  });

  window.addEventListener('appinstalled', () => {
    installPrompt = null;
    document.querySelector('.pwa-install-button')?.remove();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' }).then(reg => reg.update()).catch(() => {});
  });
}
</script>
